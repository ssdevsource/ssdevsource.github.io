name: GroKo store prices (КЗП Колко струва)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 1 * * *"   # enable after КЗП OK (written permission to re-publish)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download yesterday's zip
        id: dl
        run: |
          day=$(date -u -d 'yesterday' +%F)
          if curl -sSL --fail --retry 3 --retry-delay 20 --retry-all-errors -A "price-feed/1.0" \
               -o "$RUNNER_TEMP/day.zip" "https://kolkostruva.bg/opendata_files/$day.zip"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            # curl exit 22 = HTTP error (404 until the day's file is published): keep the old data
            if [ "$code" = 22 ]; then echo "No zip for $day yet; keeping old data."; echo "ok=false" >> "$GITHUB_OUTPUT"; else exit "$code"; fi
          fi
      - name: Build groko/prices/v1
        if: steps.dl.outputs.ok == 'true'
        run: |
          node .github/scripts/groko-prices.mjs --self-test
          day=$(date -u -d 'yesterday' +%F)
          cp "$RUNNER_TEMP/day.zip" "$RUNNER_TEMP/$day.zip"
          node .github/scripts/groko-prices.mjs "$RUNNER_TEMP/$day.zip" "$RUNNER_TEMP/out"
          mkdir -p groko/prices/v1
          cp "$RUNNER_TEMP"/out/groko/prices/v1/* groko/prices/v1/
      - name: Commit if changed
        if: steps.dl.outputs.ok == 'true'
        run: |
          if [ -n "$(git status --porcelain groko/prices/v1)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add groko/prices/v1/meta.json groko/prices/v1/prices.json.gz
            git commit -m "GroKo store prices: КЗП data"
            git push
          fi

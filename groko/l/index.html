<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Списък за пазар · GroKo</title>
<style>
  :root { --bg: #f4fbf4; --card: #e6efe6; --ink: #171d18; --quiet: #414941; --accent: #00743a; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1510; --card: #1b221c; --ink: #dfe4dd; --quiet: #c0c9be; --accent: #7ddb98; --on-accent: #00391b; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 30px; margin: 8px 0 4px; letter-spacing: -0.5px; }
  .quiet { color: var(--quiet); margin: 0 0 20px; }
  ul { list-style: none; padding: 0; margin: 0 0 24px; }
  li { background: var(--card); padding: 14px 18px; display: flex; justify-content: space-between; gap: 12px; }
  li:first-child { border-radius: 24px 24px 6px 6px; }
  li:last-child { border-radius: 6px 6px 24px 24px; }
  li:only-child { border-radius: 24px; }
  li + li { margin-top: 2px; }
  .note { display: block; color: var(--quiet); font-size: 14px; }
  .amount { white-space: nowrap; font-weight: 600; }
  a.button { display: block; text-align: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 16px; border-radius: 999px; font-weight: 600; margin-bottom: 12px; }
  a.plain { display: block; text-align: center; color: var(--accent); text-decoration: none; padding: 8px; }
  .error { background: var(--card); padding: 20px; border-radius: 24px; }
</style>
</head>
<body>
<main>
  <h1>Списък за пазар</h1>
  <p class="quiet" id="count">Изпратен от GroKo</p>
  <ul id="list"></ul>
  <a class="button" id="open" href="#">Отвори в GroKo</a>
  <a class="plain" href="https://play.google.com/store/apps/details?id=com.carkolabs.groko">Изтегли GroKo от Google Play</a>
</main>
<script>
// The list rides in the part of the address after "#", which the browser never sends to a server.
const UNITS = { kg: "кг", l: "л", pcs: "бр" };
function amount(q, unit) {
  if (typeof q !== "number" || !UNITS[unit]) return "";
  if (unit === "pcs") return Math.ceil(q - 1e-6) + " бр";
  if (q < 1) return Math.round(q * 1000 / 10) * 10 + (unit === "kg" ? " г" : " мл");
  return String(Math.round(q * 100) / 100).replace(".", ",") + " " + UNITS[unit];
}
async function decode(data) {
  const b64 = data.replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}
(async () => {
  const data = location.hash.slice(1);
  const list = document.getElementById("list");
  try {
    const rows = (await decode(data)).slice(0, 200);
    document.getElementById("count").textContent = rows.length === 1 ? "1 продукт" : rows.length + " продукта";
    for (const [product, q, unit, note] of rows) {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.textContent = String(product).slice(0, 80);
      if (note) { const n = document.createElement("span"); n.className = "note"; n.textContent = String(note).slice(0, 80); name.appendChild(n); }
      const a = document.createElement("span"); a.className = "amount"; a.textContent = amount(q, unit);
      li.append(name, a);
      list.appendChild(li);
    }
    const fallback = encodeURIComponent("https://play.google.com/store/apps/details?id=com.carkolabs.groko");
    document.getElementById("open").href = "intent://list?d=" + data + "#Intent;scheme=groko;package=com.carkolabs.groko;S.browser_fallback_url=" + fallback + ";end";
  } catch (e) {
    list.outerHTML = '<p class="error">Връзката не съдържа списък.</p>';
    document.getElementById("open").remove();
  }
})();
</script>
</body>
</html>

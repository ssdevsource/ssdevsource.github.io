<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Покана в CarKo</title>
<style>
  :root { --bg: #fdfbff; --card: #eceef9; --text: #1a1b20; --muted: #5a5d70; --accent: #3558c8; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121318; --card: #1e2028; --text: #e3e2e9; --muted: #a9acbf; --accent: #b3c5ff; --on-accent: #0b2a8a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 440px; margin: 16px; padding: 28px 24px; background: var(--card); border-radius: 28px; text-align: center; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); font-size: 14px; }
  .code { display: inline-block; margin: 4px 0 20px; padding: 8px 16px; border-radius: 16px; background: var(--bg);
          font: 600 22px/1.2 ui-monospace, Consolas, monospace; letter-spacing: .18em; }
  a.button { display: block; padding: 14px 20px; border-radius: 28px; background: var(--accent); color: var(--on-accent);
             font-weight: 600; text-decoration: none; }
  a.button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="ok" hidden>
    <h1 data-bg="Те канят в споделена кола в CarKo" data-en="You are invited to a shared car in CarKo"></h1>
    <p data-bg="С CarKo водите заедно разходите, зарежданията и обслужването на колата." data-en="With CarKo you keep the costs, fill-ups and service of a car together."></p>
    <div class="code" id="code"></div>
    <a class="button" id="install" href="#" data-bg="Инсталирай CarKo" data-en="Install CarKo"></a>
    <p class="muted" style="margin-top:16px"
       data-bg="Имаш ли вече CarKo? Върни се към съобщението и натисни линка отново – отваря се направо в приложението. Поканата важи 7 дни и е за един човек."
       data-en="Already have CarKo? Go back to the message and tap the link again – it opens right in the app. The invitation works for 7 days and for one person."></p>
  </section>
  <section id="bad" hidden>
    <h1 data-bg="Тази покана не е пълна" data-en="This invitation is incomplete"></h1>
    <p data-bg="Копирай целия линк от съобщението или помоли да ти пратят нова покана от CarKo." data-en="Copy the whole link from the message, or ask for a new invitation from CarKo."></p>
  </section>
</main>
<script>
(function () {
  // The invitation is the fragment: https://ssdevsource.github.io/kolata/j/#CODE (8 characters, the app's alphabet).
  var code = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim().toUpperCase();
  var valid = /^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{8}$/.test(code);
  var lang = (navigator.language || 'en').toLowerCase().indexOf('bg') === 0 ? 'bg' : 'en';
  document.documentElement.lang = lang;
  document.title = lang === 'bg' ? 'Покана в CarKo' : 'Invitation to CarKo';
  document.querySelectorAll('[data-bg]').forEach(function (el) { el.textContent = el.getAttribute('data-' + lang); });
  document.getElementById(valid ? 'ok' : 'bad').hidden = false;
  if (valid) {
    document.getElementById('code').textContent = code;
    // Play keeps the referrer through the install; the app reads join=CODE on its first start and shows the invitation.
    document.getElementById('install').href = 'https://play.google.com/store/apps/details?id=bg.zuck.kolata&referrer=' + encodeURIComponent('join=' + code);
  }
})();
</script>
</body>
</html>
